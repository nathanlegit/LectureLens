<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lecture Lens reads the board, not just the transcript. Upload a recording, ask it anything, and every answer cites the slide and jumps the video there." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Favicon: "Photography icons created by Magnific - Flaticon" (https://www.flaticon.com/free-icons/photography); credited in the footer and Settings. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-light.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Lecture Lens</title>
    <!-- Apply a theme chosen in Settings before the first paint, so there's no flash of the wrong one. -->
    <script>
      try {
        var t = localStorage.getItem("lecture-lens-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
